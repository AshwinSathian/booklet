name: Bug report
description: Something in Booklet isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found an auth bypass, an API key/webhook secret leak, or anything that could touch another user's data? Don't file it here — see [SECURITY.md](https://github.com/AshwinSathian/booklet/blob/main/SECURITY.md) and email instead.

  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - Web editor / share page
        - REST API
        - CLI (booklet-cli)
        - MCP server
        - GitHub Action (publish-to-booklet)
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected instead, and what actually happened.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that triggers it. A page URL, a CLI command, or an API request body is more useful than a general description.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: "CLI: `booklet --version`. Otherwise, roughly when you hit this."
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Error output, screenshots, browser/OS if relevant.
    validations:
      required: false
