# Spike S0 and its Workers counterpart: TTFB from a GitHub-hosted runner,
# which is outside the network production runs on. Lives only on the
# spike/cloudflare-workers branch and is never merged.
name: spike-ttfb

on:
  push:
    branches: [spike/cloudflare-workers]
    paths: [.github/workflows/spike-ttfb.yml, scripts/spike-ttfb.sh]

permissions:
  contents: read

jobs:
  ttfb:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # One after the other, so the two targets are measured from the same
      # runner image under the same conditions and never load each other.
      max-parallel: 1
      matrix:
        include:
          - name: production
            base: https://booklet.ashwinsathian.com
            key: BOOKLET_S0_KEY
          - name: workers
            base: https://booklet-spike-app.ashwinsathyan19.workers.dev
            key: BOOKLET_SPIKE_KEY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure
        env:
          BASE: ${{ matrix.base }}
          API_KEY: ${{ secrets[matrix.key] }}
        run: bash scripts/spike-ttfb.sh "out-${{ matrix.name }}"
      - name: Summary
        if: always()
        run: cat "out-${{ matrix.name }}/summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Raw samples
        if: always()
        run: |
          for f in home share publish; do
            echo "::group::$f (seconds, HTTP status)"
            cat "out-${{ matrix.name }}/$f.txt" || true
            echo "::endgroup::"
          done
