# CI gate for the Booklet monorepo.
#
# Runs on every pull request targeting main (and on push to main, so main
# itself always has a green build). Six jobs cover everything that can run
# without secrets this repo doesn't have in GitHub Actions:
#   - lint            eslint over the whole repo
#   - typecheck-root  tsc --noEmit for the Next.js app (src/**)
#   - typecheck-packages   tsc --noEmit for mcp-server + packages/* (excluded
#                          from the root tsconfig.json, so they need their own
#                          typecheck pass)
#   - build           next build with dummy NEXT_PUBLIC_* values (no server
#                     secret is read at build time — see comment below)
#   - unit-tests      tests/unit/** against a real MongoDB service container
#
#   - e2e            tests/e2e/** against a production build (pull requests
#                    and manual runs only — see the job's own comment)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

# Every job here only reads the checked-out code — nothing pushes, tags, or
# writes issues/PRs, so a single repo-wide read-only grant covers all of it.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Names from before the product was called Booklet must not come
      # back anywhere in the code. Changelogs say what was removed, so they
      # are left out.
      - name: No pre-Booklet names
        run: |
          if git grep -nE 'rdbl_|READABLE_|"readable"|readable-(api|mcp)|27017/readable' -- src mcp-server packages scripts tests ':!**/CHANGELOG.md' ':!src/app/changelog'; then
            echo "::error::Stale pre-Booklet name found (see matches above)."
            exit 1
          fi
      # A syntax error in a deploy script is otherwise found during a deploy.
      - name: Shell scripts parse
        run: |
          for f in scripts/*.sh scripts/lib/*.sh .githooks/*; do bash -n "$f" || exit 1; done
      - run: npm ci --prefer-offline
      - run: npm run lint
      # Every text colour token against every surface it is drawn on, for
      # the app's two themes and each document theme (WCAG AA, 4.5:1).
      - run: node scripts/check-contrast.mjs
      # The app is AGPL-3.0-only, so every production dependency must carry a
      # license that can be combined with it. A new dependency under anything
      # else fails here and gets a decision instead of slipping in. Known
      # non-obvious entries: @img/sharp-libvips (LGPL, a separate native
      # library), caniuse-lite (CC-BY data), geist (OFL-1.1 font, which the
      # checker reports as "MIT*").
      - name: Production dependency licenses
        run: >-
          npx --yes license-checker@25.0.1 --production --excludePrivatePackages --summary
          --onlyAllow 'MIT;MIT-0;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;MPL-2.0;Python-2.0;CC-BY-4.0;LGPL-3.0-or-later'

  typecheck-root:
    name: Typecheck (root)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --prefer-offline
      # tests/unit/*.spec.ts import mcp-server/src/*.ts by relative path, which
      # imports booklet-api-client (packages/shared) — tsconfig.json excludes
      # mcp-server/packages from its own glob, but that exclude doesn't stop
      # TS from typechecking them once a non-excluded file (a test spec) pulls
      # them in by reference. packages/shared's package.json points at dist/,
      # which only exists after its own build runs. Same root cause as the
      # comment on typecheck-packages' build step below.
      - run: npm run build --workspace packages/shared
      # "npm run test" is tsc --noEmit — see package.json
      - run: npm run test

  typecheck-packages:
    name: Typecheck (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [mcp-server, packages/shared, packages/cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # npm workspaces — one root
      # lockfile/install covers every package; no more per-package
      # package-lock.json to `npm ci --prefix` against.
      - run: npm ci --prefer-offline
      # mcp-server and cli both import booklet-api-client (packages/shared)
      # — npm workspaces symlinks the *source* directory,
      # but its package.json's types/main/module fields point at dist/,
      # which only exists after packages/shared's own build runs. Skipping
      # this step fails every other package's typecheck with "Cannot find
      # module 'booklet-api-client'" (found live: this exact failure on
      # the push that introduced it).
      - run: npm run build --workspace packages/shared
      - run: npm run typecheck --workspace ${{ matrix.package }}

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # NODE_ENV must NOT be set here — `npm ci` respects NODE_ENV=production
      # by skipping devDependencies (e.g. @tailwindcss/postcss, needed by
      # Next.js's PostCSS/Turbopack pipeline at build time), which broke this
      # job on every push once NODE_ENV was set job-wide instead of scoped to
      # just the build step below.
      - run: npm ci --prefer-offline
      # next build's own typecheck pass reaches mcp-server/src/*.ts the same
      # way typecheck-root does (via tests/unit/*.spec.ts's relative imports —
      # see that job's comment) and needs packages/shared built first for the
      # same reason.
      - run: npm run build --workspace packages/shared
      - run: npm run build
        env:
          NODE_ENV: production
          # Next.js only needs NEXT_PUBLIC_* vars at build time (they get
          # inlined into the client bundle). Every non-NEXT_PUBLIC_ var in
          # .env.example (MONGODB_URI, INVITE_JWT_SECRET, UNLOCK_TOKEN_SECRET,
          # SESSION_TOKEN_PEPPER, ADMIN_IPS,
          # ADMIN_USER_IDS, API_KEY_PEPPER) is read
          # lazily inside function bodies at request time (src/lib/mongodb.ts,
          # src/lib/unlock-token.ts, src/lib/invite-token.ts,
          # src/lib/auth/session-token.ts, src/middleware.ts,
          # src/lib/api-key.ts, etc.) — none of it is touched during
          # `next build`/generateStaticParams, so none of it is needed here.
          NEXT_PUBLIC_SITE_URL: http://localhost:3100

  unit-tests:
    name: Unit tests (real MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      # Same URI shape as .env.example / src/lib/mongodb.ts, pointed at the
      # service container instead of a locally brew-installed mongod.
      MONGODB_URI: "mongodb://localhost:27017/booklet?retryWrites=true&w=majority"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --prefer-offline
      # tests/unit/*.spec.ts import mcp-server/src/*.ts directly, which needs
      # packages/shared built first — see typecheck-root's comment above.
      - run: npm run build --workspace packages/shared
      # /api/v1/openapi.json is generated from the zod schemas; this checks
      # that what comes out is a valid OpenAPI 3.1 description.
      - name: Lint the OpenAPI document
        run: |
          node -e 'process.stdout.write(JSON.stringify(require("booklet-api-client").buildOpenApi("0.0.0")))' > "$RUNNER_TEMP/openapi.json"
          npx --yes @redocly/cli@2.62.1 lint "$RUNNER_TEMP/openapi.json"
      # tests/unit/** run via @playwright/test as a plain Node test runner —
      # no browser is launched, so no `playwright install` step is needed.
      - run: npm run test:unit

  # ── Full Playwright e2e suite ───────────────────────────────────────────────
  # Drives a production build (`next start`) through real browser flows:
  # sign-up and sign-in, publish, undo in Chromium and WebKit, report →
  # takedown → 410, admin gating, claiming an anonymous page. Runs on pull
  # requests because several acceptance criteria can only be checked here
  # (browser undo stacks; the middleware's loopback 410 check, which unit
  # specs have to stub). Not run on push to main: the PR run already covered
  # the same commit.
  #
  # Every secret below is a throwaway literal, not a GitHub secret: the
  # database is a per-run service container with nothing real in it, and
  # literals keep the job working on forks, which get no secrets.
  e2e:
    name: E2E (production build, Chromium + WebKit)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      PORT: "3100"
      MONGODB_URI: "mongodb://localhost:27017/booklet?retryWrites=true&w=majority"
      INVITE_JWT_SECRET: ci-only-invite-secret-not-used-anywhere-real
      UNLOCK_TOKEN_SECRET: ci-only-unlock-secret-not-used-anywhere-real
      API_KEY_PEPPER: ci-only-api-key-pepper-not-used-anywhere-real
      SESSION_TOKEN_PEPPER: ci-only-session-pepper-not-used-anywhere-real
      PASSWORD_RESET_TOKEN_PEPPER: ci-only-reset-pepper-not-used-anywhere-real
      # tests/e2e/moderation-expiry.spec.ts seeds a user with this id and
      # sends cf-connecting-ip: 127.0.0.1 — see that file's header.
      ADMIN_USER_IDS: e2e-admin
      ADMIN_IPS: 127.0.0.1
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      TEST_BASE_URL: http://localhost:3100
      # tests/e2e/accounts.spec.ts runs a stub GitHub and Google on port
      # 3199; these point the app's provider sign-in at it.
      GITHUB_CLIENT_ID: ci-stub
      GITHUB_CLIENT_SECRET: ci-stub
      SSO_GITHUB_BASE_URL: http://127.0.0.1:3199/github
      GOOGLE_CLIENT_ID: ci-stub
      GOOGLE_CLIENT_SECRET: ci-stub
      SSO_GOOGLE_BASE_URL: http://127.0.0.1:3199/google
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --prefer-offline
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build --workspace packages/shared
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm start > next-start.log 2>&1 &
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3100/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "Server did not become ready in time" >&2
          cat next-start.log >&2
          exit 1
      - run: npx playwright test --config=playwright.config.ts
      - name: Server log (on failure)
        if: failure()
        run: cat next-start.log
      # Playwright keeps a trace and a screenshot for each failed test.
      - name: Traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
