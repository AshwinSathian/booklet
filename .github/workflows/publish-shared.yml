# Publishes readable-api-client to npm when packages/shared/package.json
# version changes on main. Mirrors publish-cli.yml's pattern exactly.
# Trigger: push to main that touches packages/shared/, OR manual dispatch.
#
# Required secret: NPM_TOKEN — same Granular Access Token used by
# publish-cli.yml (Read and write on "All packages").

name: Publish shared client to npm

on:
  push:
    branches: [main]
    paths:
      - "packages/shared/package.json"
      - "packages/shared/src/**"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace packages/shared

      - name: Check if version already published
        id: version_check
        working-directory: packages/shared
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT
          if npm view readable-api-client@$PKG_VERSION version 2>/dev/null; then
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.already_published == 'false'
        run: npm publish --workspace packages/shared
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip (already published)
        if: steps.version_check.outputs.already_published == 'true'
        run: echo "readable-api-client@${{ steps.version_check.outputs.version }} already on npm — bump version to publish."
